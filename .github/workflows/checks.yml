# Automated checks on every push to main and every pull request: the type
# check, the fast checks (npm test, which includes LeadFinder's fixtures), lint
# and known security problems in the packages we ship (npm audit). The
# release gate (scripts/staging/check-deploy.mjs) runs the same checks plus
# the test-copy suites before anything goes live.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Fast checks
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Security advisories
        run: npm audit --omit=dev --audit-level=moderate
