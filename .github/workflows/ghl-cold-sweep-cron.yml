# NOTE: This workflow is a REDUNDANT BACKUP. The primary trigger is the in-app
# scheduler (src/lib/in-app-scheduler.ts, started from src/instrumentation.ts)
# which runs the cold sweep every 15 min inside the Railway server process.
# GitHub Actions schedules proved too throttled/unreliable. The sweep is
# idempotent (dedupe by ghl_message_id) and watermark-bounded, so overlap is
# harmless.
#
# GHL cold-sweep cron — runs hourly (low frequency by design).
# Pings /api/cron/ghl-cold-sweep which polls GHL for inbound SMS replies on
# DORMANT threads (last activity 14–90 days ago) that have aged out of the hot
# and baseline inbound-sync tiers. Without this, a fresh bride reply on a
# long-quiet thread only surfaces when someone next opens the thread.
#
# Required GitHub repo secrets (Settings → Secrets → Actions):
#   MARKETING_CRON_URL    = https://your-app.up.railway.app  (no trailing slash)
#   MARKETING_CRON_SECRET = same value as MARKETING_CRON_SECRET on Railway

name: GHL cold-sweep cron

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/ghl-cold-sweep
        env:
          MARKETING_CRON_URL: ${{ secrets.MARKETING_CRON_URL }}
          MARKETING_CRON_SECRET: ${{ secrets.MARKETING_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MARKETING_CRON_URL:-}" ] || [ -z "${MARKETING_CRON_SECRET:-}" ]; then
            echo "::error::Missing secrets. Add MARKETING_CRON_URL and MARKETING_CRON_SECRET on THIS repo (Settings → Secrets → Actions)."
            exit 1
          fi
          ORIGIN="${MARKETING_CRON_URL#\"}"
          ORIGIN="${ORIGIN%\"}"
          ORIGIN="$(printf '%s' "$ORIGIN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          ORIGIN="${ORIGIN%/}"
          SECRET="$(printf '%s' "$MARKETING_CRON_SECRET" | tr -d '\r\n')"
          SECRET="$(printf '%s' "$SECRET" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          URL="${ORIGIN}/api/cron/ghl-cold-sweep"
          echo "Requesting (host only): $(echo "$ORIGIN" | sed -E 's#^https?://##')"
          TMP="$(mktemp)"
          HTTP=$(curl -sS -o "$TMP" -w "%{http_code}" -H "Authorization: Bearer ${SECRET}" "$URL")
          BODY="$(cat "$TMP")"
          rm -f "$TMP"
          echo "HTTP status: $HTTP"
          echo "Response body: $BODY"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Expected HTTP 200, got $HTTP."
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"ok"'; then
            echo "::error::Response missing ok:true"
            exit 1
          fi
          echo "GHL cold-sweep cron OK."
